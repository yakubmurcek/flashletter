name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

# Least-privilege token: this workflow only reads code and runs local tooling.
permissions:
  contents: read

# Cancel in-progress runs when a new commit lands on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Display name is what shows up as the GitHub check context. Branch
    # protection on main and dev requires exactly this string.
    name: format · lint · typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json#packageManager — single source of
      # truth for CI and local.
      - uses: pnpm/action-setup@v4

      # Node version comes from .nvmrc — same idea.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Globs match the lint-staged config in the repo, so what CI rejects is
      # exactly what the local pre-commit hook would have auto-formatted.
      - name: Format check
        run: pnpm exec prettier --check "**/*.{ts,tsx,js,jsx,json,css,md}"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm tsc --noEmit

      # Copy-paste: fails when duplicated code exceeds the threshold in .jscpd.json
      # (today's value). Lower the threshold when duplication goes down, never raise it.
      # Runs even when an earlier step failed, so one run reports every problem.
      - name: Duplicate code
        if: ${{ !cancelled() }}
        run: pnpm dupes

      # Tests still run inside this job — a failure here fails the whole job
      # and blocks the merge via branch protection. The display name above
      # omits "· test" only to keep the check label short; tests still gate.
      # Coverage is printed, not enforced yet.
      - name: Test
        run: pnpm test:coverage

  database:
    # Builds an empty database from supabase/migrations + the fake seed data and
    # checks the schema file matches it. Catches a schema change without its
    # migration (or a migration without the updated schema file).
    name: database · migrations match schema
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the database from migrations + seed
        run: pnpm exec supabase db start

      - name: Schema file matches the migrations
        run: pnpm db:check

  e2e:
    # The main user flows in a real browser (desktop and phone), against a
    # production build and the local database with fake users. A dead button
    # on sign-in or a campaign opening for the wrong user turns this red.
    name: e2e · main flows
    # Pinned: Playwright 1.59 has no browser build for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Local Supabase (migrations + fake users)
        run: pnpm exec supabase start

      - name: Main flows
        run: pnpm test:e2e
        env:
          # Stripe TEST mode key (sk_test_...), for the upgrade-to-checkout flow.
          # Not available to PRs from forks, where that one test is skipped.
          STRIPE_SECRET_KEY_TEST: ${{ secrets.STRIPE_SECRET_KEY_TEST }}

      # The e2e run just built the app with fake server secrets in their real formats set.
      - name: No server secrets in the browser bundle
        run: scripts/check-client-bundle.sh

      - name: Traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
