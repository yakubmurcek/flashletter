name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

# Least-privilege token: this workflow only reads code and runs local tooling.
permissions:
  contents: read

# Cancel in-progress runs when a new commit lands on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Display name is what shows up as the GitHub check context. Branch
    # protection on main and dev requires exactly this string.
    name: format · lint · typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json#packageManager — single source of
      # truth for CI and local.
      - uses: pnpm/action-setup@v4

      # Node version comes from .nvmrc — same idea.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Globs match the lint-staged config in the repo, so what CI rejects is
      # exactly what the local pre-commit hook would have auto-formatted.
      - name: Format check
        run: pnpm exec prettier --check "**/*.{ts,tsx,js,jsx,json,css,md}"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm tsc --noEmit

      # Tests still run inside this job — a failure here fails the whole job
      # and blocks the merge via branch protection. The display name above
      # omits "· test" only to keep the check label short; tests still gate.
      - name: Test
        run: pnpm test
