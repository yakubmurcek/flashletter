version: 2
updates:
  # npm/pnpm dependencies — weekly so the PR queue stays manageable.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Prague
    open-pull-requests-limit: 5
    # Titles must pass the "PR title" check: "build(deps): bump ...".
    commit-message:
      prefix: build
      include: scope
    # A new release waits a week first: most hijacked npm releases are pulled within days.
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      # Group minor + patch updates so unrelated bumps don't each open a PR.
      # Major bumps still get their own PR for individual review.
      minor-and-patch:
        update-types:
          - minor
          - patch
    # Ignore Next.js majors here — they need a dedicated upgrade PR with
    # codemods (see vercel:next-upgrade skill); minor/patch still flow through.
    ignore:
      - dependency-name: next
        update-types:
          - version-update:semver-major

  # GitHub Actions in workflow files. Each is pinned to a commit SHA with its version in a
  # comment (a tag can be moved to other code; a SHA cannot); Dependabot bumps both together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - github-actions
